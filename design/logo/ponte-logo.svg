<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Ponte app icon: two blocks joined by a cable</title>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a8cff"/><stop offset="1" stop-color="#0a5fe6"/>
    </linearGradient>
    <linearGradient id="blue2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f82fb"/><stop offset="1" stop-color="#0857d6"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f3f7"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a3f9c" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- white tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#0f1419" stroke-opacity=".08"/>
  <g filter="url(#drop)">
    <!-- back block -->
    <rect x="98" y="52" width="110" height="110" rx="26" fill="url(#blue2)"/>
    <!-- front block -->
    <rect x="48" y="88" width="110" height="110" rx="26" fill="url(#blue)"/>
  </g>
  <!-- the cable: traces the front block's corner over the back block, then leaves the node toward the right -->
  <g fill="none" stroke="#f3f6fb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 88h30a24 24 0 0 1 24 24v46"/>
    <path d="M116 150c6 18 24 30 46 30h20"/>
  </g>
  <circle cx="116" cy="150" r="9" fill="#f3f6fb"/>
</svg>
