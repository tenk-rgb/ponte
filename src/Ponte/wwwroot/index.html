<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ponte</title>
  <link rel="preload" href="fonts/Gabarito.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="app.css">
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <div class="resize-top" id="resize-top"></div>
    <div class="brand">
      <!-- the app icon, same as the taskbar: design/logo/ponte-logo.svg -->
      <svg class="brand-icon" width="26" height="26" viewBox="0 0 256 256" aria-hidden="true">
        <defs>
          <linearGradient id="bi-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a8cff"/><stop offset="1" stop-color="#0a5fe6"/></linearGradient>
          <linearGradient id="bi-blue2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f82fb"/><stop offset="1" stop-color="#0857d6"/></linearGradient>
          <linearGradient id="bi-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f3f7"/></linearGradient>
          <filter id="bi-drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a3f9c" flood-opacity=".28"/></filter>
        </defs>
        <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bi-tile)"/>
        <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#0f1419" stroke-opacity=".1"/>
        <g filter="url(#bi-drop)"><rect x="98" y="52" width="110" height="110" rx="26" fill="url(#bi-blue2)"/><rect x="48" y="88" width="110" height="110" rx="26" fill="url(#bi-blue)"/></g>
        <g fill="none" stroke="#f3f6fb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M104 88h30a24 24 0 0 1 24 24v46"/><path d="M116 150c6 18 24 30 46 30h20"/></g>
        <circle cx="116" cy="150" r="10" fill="#f3f6fb"/>
      </svg>
      <b>Ponte</b>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="bar-actions">
      <button class="btn ghost search-btn" id="btn-search" title="Buscar (Ctrl+K)">
        <span data-icon="search"></span><span class="label">Buscar</span><kbd>Ctrl K</kbd>
      </button>
      <button class="btn icon ghost" id="btn-voice" title="Falar para o terminal" aria-label="Falar para o terminal"><span data-icon="mic"></span></button>
      <button class="btn icon ghost" id="btn-settings" title="Ajustes" aria-label="Ajustes"><span data-icon="gear"></span></button>
      <button class="btn primary small" id="btn-new"><span data-icon="plus"></span><span class="label">Nova</span></button>
    </div>
    <div class="winctl">
      <button id="win-min" title="Minimizar" aria-label="Minimizar">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="win-max" title="Maximizar" aria-label="Maximizar">
        <svg class="maximize" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x=".6" y=".6" width="8.8" height="8.8" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        <svg class="restore" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x=".6" y="2.6" width="6.8" height="6.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2.8 2.4V2a1.4 1.4 0 0 1 1.4-1.4H8A1.4 1.4 0 0 1 9.4 2v3.8A1.4 1.4 0 0 1 8 7.2h-.4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="win-close" class="x" title="Fechar" aria-label="Fechar">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M.8.8l8.4 8.4M9.2.8.8 9.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="views">
    <section class="view home" id="view-home"></section>
    <section class="view board" id="view-board" hidden></section>
  </main>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
