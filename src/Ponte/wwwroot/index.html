<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ponte</title>
  <link rel="preload" href="fonts/Gabarito.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="app.css">
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <div class="resize-top" id="resize-top"></div>
    <div class="brand">
      <!-- the mark: two arches on a deck, from design/icons/brand.svg -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 18h18 M3.5 18c1-7 3-10.5 4.5-10.5S11.5 11 12.5 18 M11.5 18c1-7 3-10.5 4.5-10.5S19.5 11 20.5 18"/>
      </svg>
      <b>Ponte</b>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="bar-actions">
      <button class="btn ghost search-btn" id="btn-search" title="Buscar (Ctrl+K)">
        <span data-icon="search"></span><span class="label">Buscar</span><kbd>Ctrl K</kbd>
      </button>
      <button class="btn icon ghost" id="btn-voice" title="Falar para o terminal" aria-label="Falar para o terminal"><span data-icon="mic"></span></button>
      <button class="btn icon ghost" id="btn-settings" title="Ajustes" aria-label="Ajustes"><span data-icon="gear"></span></button>
      <button class="btn primary small" id="btn-new"><span data-icon="plus"></span><span class="label">Nova</span></button>
    </div>
    <div class="winctl">
      <button id="win-min" title="Minimizar" aria-label="Minimizar">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="win-max" title="Maximizar" aria-label="Maximizar">
        <svg class="maximize" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x=".6" y=".6" width="8.8" height="8.8" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        <svg class="restore" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x=".6" y="2.6" width="6.8" height="6.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2.8 2.4V2a1.4 1.4 0 0 1 1.4-1.4H8A1.4 1.4 0 0 1 9.4 2v3.8A1.4 1.4 0 0 1 8 7.2h-.4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="win-close" class="x" title="Fechar" aria-label="Fechar">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M.8.8l8.4 8.4M9.2.8.8 9.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="views">
    <section class="view home" id="view-home"></section>
    <section class="view board" id="view-board" hidden></section>
  </main>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
